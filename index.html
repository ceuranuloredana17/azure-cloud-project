<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proiect Cloud - Azure</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #0078d4, #00b4d8);
            color: white;
        }
        .card {
            background: rgba(255,255,255,0.15);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        p { font-size: 1.1rem; opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>☁️ Hello from Azure!</h1>
        <p>Aplicație deployată pe Microsoft Azure</p>
        <p>Cloud Computing - Proiect Facultate</p>
    </div>
</body>
</html>
